            { id: 91, rank: 91, title: "The Vegetarian", author: "Han Kang", year: 2007, genre: "Fiction", desc: "A surreal, disturbing Korean novel about a woman who stops eating meat, sparking societal fury." },
            { id: 92, rank: 92, title: "The Body Keeps the Score", author: "Bessel van der Kolk", year: 2014, genre: "Non-Fiction", desc: "A revolutionary scientific book exploring how trauma transforms the brain and physical body." },
            { id: 93, rank: 93, title: "Americanah", author: "Chimamanda Ngozi Adichie", year: 2013, genre: "Fiction", desc: "A funny, tender, and incisive novel about race, blogging, and young love between Nigeria and America." },
            { id: 94, rank: 94, title: "Sapiens", author: "Yuval Noah Harari", year: 2014, genre: "Non-Fiction", desc: "A sweeping intellectual history of humankind from the Stone Age to modern capitalism." },
            { id: 95, rank: 95, title: "The Vanishing Half", author: "Brit Bennett", year: 2020, genre: "Fiction", desc: "A captivating multi-generational family saga about twin sisters who choose to live in two different racial worlds." },
            { id: 96, rank: 96, title: "Born a Crime", author: "Trevor Noah", year: 2016, genre: "Non-Fiction", desc: "A hilarious yet moving memoir of growing up mixed-race under apartheid in South Africa." },
            { id: 97, rank: 97, title: "Demon Copperhead", author: "Barbara Kingsolver", year: 2022, genre: "Fiction", desc: "A fierce Pulitzer Prize-winning Southern Appalachian reimagining of David Copperfield amidst the opioid crisis." },
            { id: 98, rank: 98, title: "Atomic Habits", author: "James Clear", year: 2018, genre: "Non-Fiction", desc: "A practical, scientifically backed guide on building good habits and breaking bad ones." },
            { id: 99, rank: 99, title: "Shuggie Bain", author: "Douglas Stuart", year: 2020, genre: "Fiction", desc: "A shattering Booker Prize-winning novel of a boy trying to save his alcoholic mother in 1980s Glasgow." },
            { id: 100, rank: 100, title: "Klara and the Sun", author: "Kazuo Ishiguro", year: 2021, genre: "Fiction", desc: "A tender dystopian novel told from the perspective of an Artificial Friend observing human loneliness." }
        ];

        // State Management
        let userBookData = JSON.parse(localStorage.getItem('nyt_top100_user_data')) || {};
        let currentFilter = 'all';
        let currentSort = 'rank';
        let searchQuery = '';

        // Initialize App
        function initApp() {
            renderBooks();
            updateProgress();

            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                renderBooks();
            });
        }

        // Save to LocalStorage
        function saveUserData() {
            localStorage.setItem('nyt_top100_user_data', JSON.stringify(userBookData));
            updateProgress();
        }

        // Toggle Read Status
        function toggleRead(id) {
            if (!userBookData[id]) {
                userBookData[id] = { read: false, rating: 0, notes: '' };
            }
            userBookData[id].read = !userBookData[id].read;
            saveUserData();
            renderBooks();
        }

        // Set Rating
        function setRating(id, rating) {
            if (!userBookData[id]) {
                userBookData[id] = { read: true, rating: 0, notes: '' };
            }
            userBookData[id].rating = (userBookData[id].rating === rating) ? 0 : rating; // Toggle off if clicked again
            if (userBookData[id].rating > 0) {
                userBookData[id].read = true; // Auto mark as read when rated
            }
            saveUserData();
            renderBooks();
        }

        // Save Notes
        function saveNotes(id, notes) {
            if (!userBookData[id]) {
                userBookData[id] = { read: false, rating: 0, notes: '' };
            }
            userBookData[id].notes = notes;
            saveUserData();
        }

        // Filter Setter
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const btnFilter = btn.getAttribute('data-filter');
                if (btnFilter === filter) {
                    btn.className = "filter-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all bg-white text-purple-900 shadow-sm";
                } else {
                    btn.className = "filter-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all text-purple-700 hover:text-purple-900";
                }
            });
            renderBooks();
        }

        // Sort Setter
        function setSort(sortType) {
            currentSort = sortType;
            renderBooks();
        }

        // Update Progress Bar
        function updateProgress() {
            const total = booksData.length;
            let readCount = 0;
            booksData.forEach(book => {
                if (userBookData[book.id] && userBookData[book.id].read) {
                    readCount++;
                }
            });
            const percent = Math.round((readCount / total) * 100);
            document.getElementById('progress-text').innerText = `${readCount} / ${total} (${percent}%)`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        // Render Books Grid
        function renderBooks() {
            const grid = document.getElementById('books-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            // Filter
            let filtered = booksData.filter(book => {
                const uData = userBookData[book.id] || { read: false };
                const matchesSearch = book.title.toLowerCase().includes(searchQuery) || 
                                      book.author.toLowerCase().includes(searchQuery) ||
                                      book.desc.toLowerCase().includes(searchQuery);
                
                if (!matchesSearch) return false;

                if (currentFilter === 'read') return uData.read;
                if (currentFilter === 'unread') return !uData.read;
                if (currentFilter === 'fiction') return book.genre === 'Fiction';
                if (currentFilter === 'nonfiction') return book.genre === 'Non-Fiction';
                return true;
            });

            // Sort
            filtered.sort((a, b) => {
                if (currentSort === 'rank') return a.rank - b.rank;
                if (currentSort === 'title') return a.title.localeCompare(b.title);
                if (currentSort === 'author') return a.author.localeCompare(b.author);
                if (currentSort === 'rating') {
                    const rA = (userBookData[a.id] && userBookData[a.id].rating) || 0;
                    const rB = (userBookData[b.id] && userBookData[b.id].rating) || 0;
                    return rB - rA;
                }
                return 0;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(book => {
                const uData = userBookData[book.id] || { read: false, rating: 0, notes: '' };
                const isFiction = book.genre === 'Fiction';

                // Thematic Dynamic Styling for Fiction vs Non-Fiction
                const cardBgClass = isFiction 
                    ? 'bg-gradient-to-br from-indigo-50/90 via-purple-50/80 to-blue-50/90 border-indigo-200/80 hover:border-indigo-400' 
                    : 'bg-gradient-to-br from-pink-50/90 via-rose-50/80 to-amber-50/90 border-pink-200/80 hover:border-pink-400';
                
                const badgeClass = isFiction
                    ? 'bg-indigo-100 text-indigo-800 border-indigo-200'
                    : 'bg-pink-100 text-pink-800 border-pink-200';

                const iconClass = isFiction ? 'fa-book-bookmark text-indigo-600' : 'fa-lightbulb text-pink-600';

                const card = document.createElement('div');
                card.className = `rounded-3xl p-6 border shadow-lg backdrop-blur-sm transition-all duration-300 hover:shadow-2xl flex flex-col justify-between relative overflow-hidden group ${cardBgClass}`;
                
                card.innerHTML = `
                    <!-- Background thematic accent glow -->
                    <div class="absolute -right-10 -bottom-10 w-40 h-40 rounded-full blur-2xl opacity-30 pointer-events-none ${isFiction ? 'bg-indigo-400' : 'bg-pink-400'}"></div>

                    <div>
                        <!-- Top Bar: Rank & Genre Badge -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-3 py-1 bg-purple-900 text-white rounded-full text-xs font-bold shadow-sm">
                                #${book.rank}
                            </span>
                            <span class="px-3 py-1 rounded-full text-xs font-semibold border ${badgeClass} flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid ${iconClass}"></i> ${book.genre} (${book.year})
                            </span>
                        </div>

                        <!-- Book Title & Author -->
                        <h2 class="book-title text-xl font-bold text-gray-900 mb-1 group-hover:text-purple-900 transition-colors">
                            ${book.title}
                        </h2>
                        <p class="text-sm font-medium text-purple-800/80 mb-3 italic">by ${book.author}</p>

                        <!-- Description -->
                        <p class="text-xs text-gray-600 leading-relaxed mb-4">
                            ${book.desc}
                        </p>
                    </div>

                    <div>
                        <!-- User Rating Stars -->
                        <div class="flex items-center justify-between mb-4 pt-3 border-t border-purple-200/50">
                            <div class="flex items-center gap-1">
                                <span class="text-xs font-semibold text-gray-600 mr-2">My Rating:</span>
                                ${[1, 2, 3, 4, 5].map(star => `
                                    <button onclick="setRating(${book.id}, ${star})" class="text-sm transition-transform hover:scale-125 focus:outline-none ${uData.rating >= star ? 'text-yellow-400 drop-shadow' : 'text-gray-300'}">
                                        <i class="fa-solid fa-star"></i>
                                    </button>
                                `).join('')}
                            </div>

                            <!-- Read Status Toggle Button -->
                            <button onclick="toggleRead(${book.id})" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 ${uData.read ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-white text-purple-800 border border-purple-300 hover:bg-purple-100'}">
                                <i class="fa-solid ${uData.read ? 'fa-check-circle' : 'fa-circle'}"></i>
                                ${uData.read ? 'Read' : 'Mark Read'}
                            </button>
                        </div>

                        <!-- Personal Notes Expandable Section -->
                        <div class="mt-2">
                            <input type="text" value="${uData.notes || ''}" placeholder="Add private reading note..." 
                                onchange="saveNotes(${book.id}, this.value)"
                                class="w-full px-3 py-2 bg-white/70 border border-purple-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all shadow-inner">
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Run on load
        window.onload = initApp;
    </script>
</body>
</html>
